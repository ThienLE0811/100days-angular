<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo-area">
        <span class="angular-badge">Angular</span>
        <h2>100 Days Lab</h2>
      </div>
      <p class="author-tag">Tác giả: <strong>Thiện Lê</strong></p>
      
      <div class="search-box">
        <input
          type="text"
          placeholder="Tìm bài học (ví dụ: Day 13, form, rxjs)..."
          [value]="search()"
          (input)="onSearch($event)"
        />
      </div>
    </div>

    <nav class="nav-list">
      @for (item of filteredDays(); track item.path) {
        <a
          class="nav-item"
          [routerLink]="item.path"
          routerLinkActive="active"
        >
          <span class="day-badge">D{{ item.dayNum }}</span>
          <span class="day-name">{{ item.title }}</span>
          @if (hasBadge(item.dayNum)) {
            <span class="badge-dot" title="Đã có nội dung thực hành"></span>
          }
        </a>
      } @empty {
        <div class="empty-state">Không tìm thấy bài học phù hợp</div>
      }
    </nav>
  </aside>

  <!-- Main Content Area -->
  <main class="main-content">
    <header class="topbar">
      <div class="topbar-title">
        <span>Workspace Thực Hành Angular</span>
      </div>
      <div class="topbar-meta">
        <span>Tổng cộng: {{ days().length }} components</span>
      </div>
    </header>

    <section class="content-body">
      <router-outlet></router-outlet>
    </section>
  </main>
</div>
