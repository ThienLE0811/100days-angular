@if (article(); as article) {
  <article class="article-detail">
    <a class="back-link" routerLink="../">← Quay lại danh sách</a>
    <h3>{{ article.title }}</h3>
    <p class="slug-tag">slug: <code>{{ slug() }}</code></p>
    <p>{{ article.content }}</p>
  </article>
} @else {
  <div class="not-found">
    <a class="back-link" routerLink="../">← Quay lại danh sách</a>
    <p>Không tìm thấy bài viết với slug <code>{{ slug() }}</code>.</p>
  </div>
}
